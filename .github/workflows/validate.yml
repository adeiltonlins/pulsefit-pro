name: Validar PulseFit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, curl

      - name: Validar PHP
        run: |
          php -l api/bootstrap.php
          php -l api/index.php
          php -l api/features.php
          php -l api/management.php
          php -l api/advanced.php
          php -l api/commercial.php
          php -l api/support.php
          php -l api/migrations.php
          php -l api/migrations_performance.php
          php -l api/migrations_branding.php
          php -l api/exercise_seed.php
          php -l api/exercise_ptbr.php
          php -l api/brand_kit.php
          php -l api/security.php
          php -l api/roadmap.php
          php -l api/coach_pro.php
          php -l api/student_pro.php
          php -l api/reports.php
          php -l api/growth.php
          php -l api/admin_ai.php
          php -l api/production.php
          php -l api/performance_tools.php
          php -l deploy/init-db.php
          php -l deploy/migrate.php
          php -l tests/router.php
          php -l tests/branding_smoke.php

      - name: Smoke test API
        run: bash tests/smoke.sh

      - name: Smoke prontidão operacional
        run: bash tests/production-smoke.sh

      - name: Smoke performance
        run: bash tests/performance_smoke.sh

      - name: Smoke branding e biblioteca
        run: php tests/branding_smoke.php

      - name: Mostrar logs se smoke falhar
        if: failure()
        run: |
          echo '--- /tmp/pulsefit-smoke.log ---'
          cat /tmp/pulsefit-smoke.log || true
          echo '--- /tmp/pulsefit-production-smoke.log ---'
          cat /tmp/pulsefit-production-smoke.log || true
          echo '--- /tmp/pulsefit-performance.log ---'
          cat /tmp/pulsefit-performance.log || true

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar frontend
        working-directory: frontend
        run: npm install

      - name: Build React
        working-directory: frontend
        run: npm run build
